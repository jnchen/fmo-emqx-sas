services:
  fmo:
    image: ${FMO_IMAGE:-ghcr.io/your-org/fmo-emqx-sas:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${MQTT_PORT}:1883"
      - "${WEB_PORT:-18080}:8081"
    environment:
      SAS_SERVER_UID: "${SAS_SERVER_UID}"
      SAS_SERVER_CALLSIGN: "${SAS_SERVER_CALLSIGN}"
      SAS_MQTT_HOST: "${SAS_MQTT_HOST}"
      SAS_MQTT_PORT: "${SAS_MQTT_PORT}"
      SAS_CERT_FINGERPRINT: "${SAS_CERT_FINGERPRINT}"
      SAS_HTTP_ADDR: "127.0.0.1"
      SAS_HTTP_PORT: "8080"
      # 空字符串表示不覆盖 data/sas/config.json 里已有的集群/管理员。
      SAS_CLUSTERS_JSON: "${SAS_CLUSTERS_JSON:-}"
      SAS_ADMINS_JSON: "${SAS_ADMINS_JSON:-}"
      FAS_ENABLED: "${FAS_ENABLED:-1}"
      FAS_AUTOCONFIG: "${FAS_AUTOCONFIG:-1}"
      FAS_ADMIN_USERNAME: "${FAS_ADMIN_USERNAME:-admin}"
      FAS_ADMIN_PASSWORD: "${FAS_ADMIN_PASSWORD:-}"
      WEB_ENABLED: "${WEB_ENABLED:-1}"
      WEB_LISTEN_PORT: "8081"
      WEB_DEFAULT: "${WEB_DEFAULT:-fas}"
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_DASHBOARD_USERNAME:-admin}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD}"
    volumes:
      - ./data/emqx:/opt/emqx/data
      - ./data/sas:/opt/fmo-data/sas
      - ./data/fas:/opt/fmo-data/fas
